<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="103" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Outer Glow Pulse Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ef4444" stroke-width="6" stroke-dasharray="16 12" opacity="0.3"/>
  
  <!-- Center Shield / Pin Backplate -->
  <circle cx="256" cy="256" r="145" fill="url(#blueGrad)" filter="url(#glow)" opacity="0.95"/>
  <circle cx="256" cy="256" r="125" fill="#090d16"/>
  
  <!-- Medical Red Cross -->
  <rect x="228" y="176" width="56" height="160" rx="14" fill="url(#redGrad)" filter="url(#glow)"/>
  <rect x="176" y="228" width="160" height="56" rx="14" fill="url(#redGrad)" filter="url(#glow)"/>
  
  <!-- Heartbeat ECG Pulse Line overlay in White -->
  <path d="M 160 256 L 210 256 L 230 200 L 256 310 L 282 220 L 302 256 L 352 256" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Beacon Dot -->
  <circle cx="256" cy="140" r="14" fill="#38bdf8" filter="url(#glow)"/>
</svg>
